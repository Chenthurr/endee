services:
  - type: web
    name: endee
    runtime: docker
    plan: 2c-8g
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: BUILD_ARCH
        value: avx2
      - key: NDD_SERVER_PORT
        value: "8080"
      - key: NDD_DATA_DIR
        value: /data
      - key: NDD_NUM_SERVER_THREADS
        value: "0"
      - key: NDD_LOG_LEVEL
        value: info
      - key: NDD_DEBUG_LOG
        value: "false"
      - key: PORT
        value: "8080"
      - key: NDD_AUTH_TOKEN
        sync: false
    disk:
      name: endee-data
      mountPath: /data
      sizeGB: 20
